services:
  app:
    build:
      context: .
    image: macaron-app
    container_name: macaron-app
    restart: unless-stopped
    # Localhost-only: Caddy fronts this at <host>/macaroon, matching how the
    # other path-routed apps on this box are published.
    ports:
      - "127.0.0.1:3400:3000"
    environment:
      NODE_ENV: production
    # Must hit the basePath — the app serves nothing at "/".
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/macaroon"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
